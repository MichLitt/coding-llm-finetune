[project]
name = "coding-llm"
version = "0.3.0"
description = "CodeTune v3: clean SFT+DPO post-training pipeline for Qwen3.5-4B-Instruct"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "datasketch>=1.6.4",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "transformers>=4.45.0",
    "tokenizers>=0.19.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "anthropic>=0.92.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.3.0",
    "peft>=0.11.0",
    "trl>=0.9.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.0",
]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
]

# Ablation experiment matrix for v3
# Usage: python scripts/sft_train.py --exp-id <key>

experiments:
  # Core experiment: generic data only (ablation baseline)
  sft_generic:
    description: "Generic only: Magicoder + EvolCodeAlpaca"
    data_sources: [magicoder, evol]
    lora_r: 32
    num_train_epochs: 3

  # Primary experiment: generic + targeted failure patterns
  sft_targeted:
    description: "Generic + Targeted (primary): adds Coder-Agent failure patterns"
    data_sources: [magicoder, evol, targeted]
    lora_r: 32
    num_train_epochs: 3

  # Ablation: lower LoRA rank
  sft_targeted_r16:
    description: "Rank ablation: r=16 vs r=32"
    data_sources: [magicoder, evol, targeted]
    lora_r: 16
    num_train_epochs: 3

  # Ablation: fewer epochs (check overfitting on small dataset)
  sft_targeted_ep2:
    description: "Epoch ablation: 2 epochs vs 3"
    data_sources: [magicoder, evol, targeted]
    lora_r: 32
    num_train_epochs: 2

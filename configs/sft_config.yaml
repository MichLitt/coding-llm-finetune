# SFT training configuration for Colab A100 40GB
# Run: python scripts/sft_train.py --config configs/sft_config.yaml --exp-id <name>

model:
  name: "unsloth/Qwen3.5-9B"
  max_seq_length: 2048
  load_in_4bit: false          # A100 40GB: bf16 LoRA (~24GB, fits well)
  dtype: "bfloat16"

lora:
  r: 64
  lora_alpha: 128              # 2 × r
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4    # effective batch = 16
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  optim: "adamw_8bit"
  group_by_length: true             # reduces padding waste
  dataloader_num_workers: 4
  seed: 42

checkpointing:
  output_dir: "results/sft_checkpoints"
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"

data:
  train_file: "data/processed/sft_train.jsonl"
  val_file:   "data/processed/sft_val.jsonl"
  dataset_text_field: "text"

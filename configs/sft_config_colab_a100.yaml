# SFT training profile for Colab A100 (40 or 80 GB).
# The single reference profile for v3.1 (the H100 profile is identical). LoRA r/alpha,
# learning rate, epochs and data sources are owned by configs/ablation_matrix.yaml;
# the values under `lora:`/`learning_rate` below are only fallbacks.
# Usage:
#   python scripts/sft_train.py --config-path configs/sft_config_colab_a100.yaml --exp-id sft_generic_aggr

model:
  name: "unsloth/Qwen3.5-4B"
  max_seq_length: 1024            # 数据已过滤至 ≤1024 token，无需更长
  load_in_4bit: false
  dtype: "bfloat16"

lora:
  r: 32                           # fallback only; the ablation matrix sets r and alpha
  lora_alpha: 64                  # keep alpha = 2 * r
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42

training:
  per_device_train_batch_size: 16  # sized for a 40 GB A100 (the Colab A100 seen in practice); batch 32 was
                                   # an ~45 GB estimate for 80 GB cards. Effective batch is unchanged.
  gradient_accumulation_steps: 4   # effective batch = 16 x 4 = 64
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  optim: "adamw_torch_fused"
  group_by_length: true
  dataloader_num_workers: 4
  seed: 42

checkpointing:
  output_dir: "results/sft_checkpoints"
  logging_steps: 10
  eval_steps: 25                  # the whole run is only ~60-170 steps; a checkpoint every 25
  save_steps: 25                  # steps keeps a Colab disconnect cheap (resume with --resume-from auto)
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"

data:
  train_file: "data/processed/sft_train.jsonl"
  val_file: "data/processed/sft_val.jsonl"
  dataset_text_field: "text"

# SFT training profile for Colab Pro A100 80 GB.
# Usage:
#   python scripts/sft_train.py --config-path configs/sft_config_colab_a100.yaml --exp-id sft_targeted

model:
  name: "unsloth/Qwen3.5-4B"
  max_seq_length: 1024            # 数据已过滤至 ≤1024 token，无需更长
  load_in_4bit: false
  dtype: "bfloat16"

lora:
  r: 64                           # 从 32 升至 64，提高模型容量
  lora_alpha: 128                 # 保持 2x r
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42

training:
  per_device_train_batch_size: 32  # 从 16 升至 32，预计用 ~45 GB VRAM
  gradient_accumulation_steps: 2   # effective batch: 64，梯度估计更稳定
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  optim: "adamw_torch_fused"
  group_by_length: true
  dataloader_num_workers: 4
  seed: 42

checkpointing:
  output_dir: "results/sft_checkpoints"
  logging_steps: 10
  eval_steps: 250
  save_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "wandb"

data:
  train_file: "data/processed/sft_train.jsonl"
  val_file: "data/processed/sft_val.jsonl"
  dataset_text_field: "text"

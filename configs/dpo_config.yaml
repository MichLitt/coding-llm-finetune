# DPO training configuration
# Local RTX 5070 8GB: load_in_4bit=true (base model loaded in 4-bit, adapter in bf16)
# Run: python scripts/dpo_train.py --sft-checkpoint results/sft_checkpoints/sft_generic_cons/final

model:
  max_seq_length: 2048
  dtype: "bfloat16"
  load_in_4bit: true           # RTX 5070 8GB; set false on A100 for bf16

lora:
  r: 16                             # Smaller rank than SFT to limit drift
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: "unsloth"
  random_state: 42

dpo:
  beta: 0.1                         # KL penalty; try 0.3 if overall pass@1 degrades
  loss_type: "sigmoid"
  max_prompt_length: 512
  max_length: 1536

training:
  per_device_train_batch_size: 1    # DPO needs chosen+rejected simultaneously
  gradient_accumulation_steps: 16   # effective batch = 16
  num_train_epochs: 1               # 1 epoch prevents reward hacking on small dataset
  learning_rate: 5.0e-6            # conservative first run; raise to 2e-5 only if reward margins barely move
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: true
  tf32: false
  optim: "adamw_8bit"
  seed: 42

checkpointing:
  output_dir: "results/dpo_checkpoints"
  logging_steps: 2
  eval_steps: 20
  save_steps: 50
  save_total_limit: 2
  report_to: "wandb"

data:
  train_file: "data/processed/dpo_pairs.jsonl"
  val_file:   "data/processed/dpo_pairs_val.jsonl"
